<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Бизнес Кликер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e; color: #fff; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .balance { font-size: 36px; font-weight: bold; color: #ffd700; margin: 12px 0; }
    .income { font-size: 14px; color: #9ca3af; margin-bottom: 20px; }
    .click-btn {
      width: 160px; height: 160px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
      font-size: 48px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
      transition: transform 0.1s; margin-bottom: 24px;
    }
    .click-btn:active { transform: scale(0.94); }
    .shop { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .biz-item {
      background: #16213e; border-radius: 12px; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid #2a2a4a;
    }
    .biz-info { text-align: left; }
    .biz-name { font-size: 15px; font-weight: 600; }
    .biz-effect { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .buy-btn {
      background: #ffd700; color: #1a1a2e; border: none;
      padding: 10px 16px; border-radius: 8px; font-weight: bold;
      cursor: pointer; font-size: 14px;
    }
    .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>💰 Бизнес Кликер</h1>
  <div class="balance" id="balance">0</div>
  <div class="income" id="income">Доход: 0 / сек</div>
  <button class="click-btn" id="clickBtn">💼</button>
  <div class="shop" id="shop"></div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const state = {
      coins: 0,
      businesses: [
        { id: 'coffee', name: '☕ Кофейня', basePrice: 10, income: 1, owned: 0 },
        { id: 'shop',   name: '🏪 Магазин', basePrice: 100, income: 5, owned: 0 },
        { id: 'factory',name: '🏭 Завод',   basePrice: 1000, income: 30, owned: 0 },
      ],
    };

    const balanceEl = document.getElementById('balance');
    const incomeEl = document.getElementById('income');
    const shopEl = document.getElementById('shop');
    const clickBtn = document.getElementById('clickBtn');

    function priceOf(biz) { return Math.floor(biz.basePrice * Math.pow(1.15, biz.owned)); }
    function totalIncome() { return state.businesses.reduce((s, b) => s + b.income * b.owned, 0); }
    function formatNumber(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return Math.floor(n);
    }

    function render() {
      balanceEl.textContent = formatNumber(state.coins);
      incomeEl.textContent = 'Доход: ' + formatNumber(totalIncome()) + ' / сек';
      shopEl.innerHTML = '';
      state.businesses.forEach(biz => {
        const price = priceOf(biz);
        const canBuy = state.coins >= price;
        const item = document.createElement('div');
        item.className = 'biz-item';
        item.innerHTML = `
          <div class="biz-info">
            <div class="biz-name">${biz.name} ${biz.owned > 0 ? '×' + biz.owned : ''}</div>
            <div class="biz-effect">+${biz.income}/сек за штуку</div>
          </div>
          <button class="buy-btn" ${canBuy ? '' : 'disabled'}>${formatNumber(price)}</button>
        `;
        item.querySelector('.buy-btn').addEventListener('click', () => buy(biz));
        shopEl.appendChild(item);
      });
    }

    function buy(biz) {
      const price = priceOf(biz);
      if (state.coins < price) return;
      state.coins -= price;
      biz.owned += 1;
      render();
    }

    clickBtn.addEventListener('click', () => { state.coins += 1; render(); });
    setInterval(() => { const i = totalIncome(); if (i > 0) { state.coins += i; render(); } }, 1000);
    render();
  </script>
</body>
</html>
